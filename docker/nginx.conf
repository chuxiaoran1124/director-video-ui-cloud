    user nginx;
    worker_processes auto;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        server {
            listen 80;
            server_name _;

            # 将 root 放到 server 顶层，统一作用于各 location
            root /usr/share/nginx/html;
            index index.html;

            # 前端静态资源：命中哈希文件并长缓存
            location /assets/ {
                try_files $uri =404;
                access_log off;
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            # 可选：element-plus 静态目录（如存在）
            location /element-plus/ {
                try_files $uri =404;
                access_log off;
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            # 单页应用入口，支持前端路由
            location / {
                try_files $uri $uri/ /index.html;
            }

            # 后端 API 代理（按需启用并替换实际地址）
            location /api/ {
                proxy_pass http://django_app:8000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
            }

            # TOS 对象存储代理（解决前端跨域下载问题）
            location /tos-proxy/ {
                proxy_pass https://test-basket.tos-cn-beijing.volces.com/;
                proxy_ssl_server_name on;
                proxy_set_header Host test-basket.tos-cn-beijing.volces.com;
                proxy_set_header Referer '';
                proxy_hide_header Access-Control-Allow-Origin;
                add_header Access-Control-Allow-Origin *;
            }

            # 404 页面（可选）
            error_page 404 /404.html;
            location = /404.html { internal; }

            # 拒绝隐藏文件访问
            location ~ /\. { deny all; }
        }
    }